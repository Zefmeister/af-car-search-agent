name: car-search-agent
description: AI-powered car search assistant that helps users find available cars by zip code, budget, and preferences
template:
  kind: hosted
  protocols:
    responses: "1.0.0"
  environment_variables:
    - name: FOUNDRY_PROJECT_ENDPOINT
      description: Foundry project endpoint URL
    - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
      description: Model deployment name (e.g., gpt-4.1-mini)
