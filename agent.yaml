name: car-search-agent
description: Car Advisor — multi-agent system with orchestrator routing to Car Finder, Safety Checker, and Price Estimator specialists via HandoffBuilder workflow
template:
  kind: hosted
  protocols:
    responses: "1.0.0"
  environment_variables:
    - name: FOUNDRY_PROJECT_ENDPOINT
      description: Foundry project endpoint URL
    - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
      description: Model deployment name (e.g., gpt-4.1-mini)
    - name: MOCK_MODE
      description: Set to true to use mock data instead of live NHTSA APIs (default false)
